services:
  backend:
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SQLITE_PATH: /app/data/app.db
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_ISSUER: ${JWT_ISSUER:-auth-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auth-api-users}
      JWT_REALM: ${JWT_REALM:-access-to-auth-api}
      JWT_EXPIRES_MS: ${JWT_EXPIRES_MS:-86400000}
      SUPER_KEY: ${SUPER_KEY:-}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  backend_data:
